<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="jk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#jk-grad)" />
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#fca5a5" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Crown / Leaf Top Accent -->
  <path d="M256 90 L280 135 L325 115 L300 160 L350 160 L256 120 L162 160 L212 160 L187 115 L232 135 Z" fill="#fbbf24" />
  
  <!-- "JK" Bold Emblem -->
  <text x="256" y="340" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="210" fill="#ffffff" text-anchor="middle" letter-spacing="-6" filter="url(#shadow)">JK</text>
  
  <!-- Subtext DISTRO -->
  <text x="256" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="48" fill="#fef08a" text-anchor="middle" letter-spacing="8">DISTRO</text>
</svg>
